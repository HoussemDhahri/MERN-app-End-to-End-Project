apiVersion: batch/v1
kind: Job
metadata:
  name: todolist-loadgenerator-job
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded

spec:
  backoffLimit: 0

  template:
    metadata:
      labels:
        app: loadgenerator

    spec:
      restartPolicy: Never

      containers:
        - name: k6
          image: grafana/k6:latest
          imagePullPolicy: Always

          envFrom:
            - configMapRef:
                name: todolist-loadgenerator-config

          command:
            - k6

          args:
            - run
            - /scripts/loadtest.js

          volumeMounts:
            - name: loadtest-script
              mountPath: /scripts

          resources:
            requests:
              cpu: "200m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"

      volumes:
        - name: loadtest-script
          configMap:
            name: todolist-loadgenerator-config
            items:
              - key: loadtest.js
                path: loadtest.js