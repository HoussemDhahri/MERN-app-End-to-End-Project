apiVersion: monitoring.coreos.com/v1
kind: Probe

metadata:
  name: todolist-frontend
  namespace: monitoring
  labels:
    release: monitoring

spec:
  jobName: todolist-frontend-blackbox

  interval: 30s
  scrapeTimeout: 10s

  module: http_2xx

  prober:
    url: blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc:9115
    scheme: http

  targets:
    staticConfig:
      static:
        - http://todolist-frontend-service.todolist-staging.svc:3000/
        - http://todolist-frontend-service.todolist-prod.svc:3000/