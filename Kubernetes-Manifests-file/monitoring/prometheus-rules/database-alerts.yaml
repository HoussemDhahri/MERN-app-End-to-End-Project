apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: todolist-database-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: todolist.database
      rules:

        - alert: TodoListDatabaseDown
          expr: |
            kube_statefulset_status_replicas_ready{
              namespace=~"todolist-staging|todolist-prod",
              statefulset="todolist-database-statefulset"
            } < 1
          for: 5m
          labels:
            severity: critical
            component: database
          annotations:
            summary: "TodoList MongoDB is down"
            description: "The MongoDB StatefulSet has no ready replicas in namespace {{ $labels.namespace }}."

        - alert: TodoListDatabaseRestarts
          expr: |
            increase(
              kube_pod_container_status_restarts_total{
                namespace=~"todolist-staging|todolist-prod",
                pod=~"todolist-database-statefulset-.*",
                container="mongodb"
              }[10m]
            ) > 0
          for: 5m
          labels:
            severity: warning
            component: database
          annotations:
            summary: "TodoList MongoDB restarted"
            description: "The MongoDB container restarted during the last 10 minutes in namespace {{ $labels.namespace }}."

        - alert: TodoListDatabaseHighCPU
          expr: |
            (
              sum by (namespace, pod, container) (
                rate(container_cpu_usage_seconds_total{
                  namespace=~"todolist-staging|todolist-prod",
                  pod=~"todolist-database-statefulset-.*",
                  container="mongodb"
                }[5m])
              )
              /
              on(namespace, pod, container)
              kube_pod_container_resource_limits{
                namespace=~"todolist-staging|todolist-prod",
                pod=~"todolist-database-statefulset-.*",
                container="mongodb",
                resource="cpu",
                unit="core"
              }
            ) > 0.80
          for: 5m
          labels:
            severity: warning
            component: database
          annotations:
            summary: "TodoList MongoDB CPU usage is high"
            description: "MongoDB CPU usage is above 80% of its CPU limit in namespace {{ $labels.namespace }}."

        - alert: TodoListDatabaseHighMemory
          expr: |
            (
              sum by (namespace, pod, container) (
                container_memory_working_set_bytes{
                  namespace=~"todolist-staging|todolist-prod",
                  pod=~"todolist-database-statefulset-.*",
                  container="mongodb"
                }
              )
              /
              on(namespace, pod, container)
              kube_pod_container_resource_limits{
                namespace=~"todolist-staging|todolist-prod",
                pod=~"todolist-database-statefulset-.*",
                container="mongodb",
                resource="memory",
                unit="byte"
              }
            ) > 0.80
          for: 5m
          labels:
            severity: warning
            component: database
          annotations:
            summary: "TodoList MongoDB memory usage is high"
            description: "MongoDB memory usage is above 80% of its memory limit in namespace {{ $labels.namespace }}."

        - alert: TodoListDatabasePVCAlmostFull
          expr: |
            (
              kubernetes_pvc_used_bytes{
                exported_namespace=~"todolist-staging|todolist-prod"
              }
              /
              on(exported_namespace,persistentvolume,persistentvolumeclaim)
              kubernetes_pvc_capacity_bytes{
                exported_namespace=~"todolist-staging|todolist-prod"
              }
            ) > 0.80
          for: 10m
          labels:
            component: database
            severity: warning
          annotations:
            summary: TodoList MongoDB PVC usage is high
            description: A MongoDB PVC is using more than 80% of its available storage in namespace {{ $labels.exported_namespace }}.