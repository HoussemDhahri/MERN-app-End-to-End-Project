apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: todolist-database-alerts
  namespace: monitoring
  labels:
    release: monitoring

spec:
  groups:
    - name: todolist.database
      rules:

        - alert: TodoListDatabaseDown
          expr: |
            (
              label_replace(
                kube_statefulset_status_replicas_ready{
                  namespace=~"todolist-(staging|prod)",
                  statefulset="todolist-database-statefulset"
                },
                "target_namespace",
                "$1",
                "namespace",
                "(todolist-(staging|prod))"
              ) == 0
            )
            and on (target_namespace)
            (
              label_replace(
                kube_namespace_status_phase{
                  namespace=~"todolist-(staging|prod)",
                  phase="Active"
                },
                "target_namespace",
                "$1",
                "namespace",
                "(todolist-(staging|prod))"
              ) == 1
            )
          for: 2m
          labels:
            severity: critical
            component: database
          annotations:
            summary: "TodoList MongoDB is down in {{ $labels.target_namespace }}"
            description: "MongoDB StatefulSet in {{ $labels.target_namespace }} has no ready replicas for more than 2 minutes."

        - alert: TodoListDatabaseHighCPU
          expr: |
            label_replace(
              (
                sum by (namespace, pod) (
                  rate(
                    container_cpu_usage_seconds_total{
                      namespace=~"todolist-(staging|prod)",
                      pod=~"todolist-database-statefulset-.*",
                      container="mongodb"
                    }[5m]
                  )
                )
                /
                sum by (namespace, pod) (
                  kube_pod_container_resource_requests{
                    namespace=~"todolist-(staging|prod)",
                    pod=~"todolist-database-statefulset-.*",
                    container="mongodb",
                    resource="cpu",
                    unit="core"
                  }
                )
              ),
              "target_namespace",
              "$1",
              "namespace",
              "(todolist-(staging|prod))"
            ) > 0.80
          for: 10m
          labels:
            severity: warning
            component: database
          annotations:
            summary: "TodoList MongoDB CPU is high in {{ $labels.target_namespace }}"
            description: "MongoDB pod {{ $labels.pod }} in {{ $labels.target_namespace }} is using more than 80% of its requested CPU for more than 10 minutes."

        - alert: TodoListDatabaseHighMemory
          expr: |
            label_replace(
              (
                sum by (namespace, pod) (
                  container_memory_working_set_bytes{
                    namespace=~"todolist-(staging|prod)",
                    pod=~"todolist-database-statefulset-.*",
                    container="mongodb"
                  }
                )
                /
                sum by (namespace, pod) (
                  kube_pod_container_resource_requests{
                    namespace=~"todolist-(staging|prod)",
                    pod=~"todolist-database-statefulset-.*",
                    container="mongodb",
                    resource="memory",
                    unit="byte"
                  }
                )
              ),
              "target_namespace",
              "$1",
              "namespace",
              "(todolist-(staging|prod))"
            ) > 0.80
          for: 10m
          labels:
            severity: warning
            component: database
          annotations:
            summary: "TodoList MongoDB memory is high in {{ $labels.target_namespace }}"
            description: "MongoDB pod {{ $labels.pod }} in {{ $labels.target_namespace }} is using more than 80% of its requested memory for more than 10 minutes."

        - alert: TodoListDatabasePodRestarting
          expr: |
            label_replace(
              sum by (namespace, pod) (
                increase(
                  kube_pod_container_status_restarts_total{
                    namespace=~"todolist-(staging|prod)",
                    pod=~"todolist-database-statefulset-.*",
                    container="mongodb"
                  }[10m]
                )
              ),
              "target_namespace",
              "$1",
              "namespace",
              "(todolist-(staging|prod))"
            ) > 3
          for: 3m
          labels:
            severity: warning
            component: database
          annotations:
            summary: "TodoList MongoDB pod is restarting in {{ $labels.target_namespace }}"
            description: "MongoDB pod {{ $labels.pod }} in {{ $labels.target_namespace }} has restarted more than 3 times in the last 10 minutes."

        - alert: TodoListDatabasePVCAlmostFull
          expr: |
            label_replace(
              (
                kubernetes_pvc_used_bytes{
                  exported_namespace=~"todolist-(staging|prod)"
                }
                /
                on(exported_namespace, persistentvolume, persistentvolumeclaim)
                kubernetes_pvc_capacity_bytes{
                  exported_namespace=~"todolist-(staging|prod)"
                }
              ),
              "target_namespace",
              "$1",
              "exported_namespace",
              "(todolist-(staging|prod))"
            ) > 0.80
          for: 10m
          labels:
            severity: warning
            component: database
          annotations:
            summary: "TodoList MongoDB PVC usage is high in {{ $labels.target_namespace }}"
            description: "MongoDB PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.target_namespace }} is using more than 80% of its available storage for more than 10 minutes."