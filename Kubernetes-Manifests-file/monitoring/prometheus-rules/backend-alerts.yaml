apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: todolist-backend-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: todolist.backend
      rules:

        - alert: TodoListBackendDown
          expr: |
            kube_deployment_status_replicas_available{
              namespace=~"todolist-staging|todolist-prod",
              deployment="todolist-backend-deployment"
            } < 1
          for: 5m
          labels:
            severity: critical
            component: backend
          annotations:
            summary: "TodoList backend is down"
            description: "The TodoList backend has no available replicas in namespace {{ $labels.namespace }}."

        - alert: TodoListBackendRestarts
          expr: |
            increase(
              kube_pod_container_status_restarts_total{
                namespace=~"todolist-staging|todolist-prod",
                pod=~"todolist-backend-deployment-.*",
                container!="POD",
                container!=""
              }[10m]
            ) > 0
          for: 5m
          labels:
            severity: warning
            component: backend
          annotations:
            summary: "TodoList backend restarted"
            description: "The TodoList backend container restarted during the last 10 minutes in namespace {{ $labels.namespace }}."

        - alert: TodoListBackendHighCPU
          expr: |
            (
              rate(container_cpu_usage_seconds_total{
                namespace=~"todolist-staging|todolist-prod",
                pod=~"todolist-backend-deployment-.*",
                container="todolist-backend"
              }[5m])
              /
              kube_pod_container_resource_limits{
                namespace=~"todolist-staging|todolist-prod",
                pod=~"todolist-backend-deployment-.*",
                container="todolist-backend",
                resource="cpu",
                unit="core"
              }
            ) > 0.80
          for: 5m
          labels:
            severity: warning
            component: backend
          annotations:
            summary: "TodoList backend CPU usage is high"
            description: "Backend CPU usage is above 80% of its CPU limit in namespace {{ $labels.namespace }}."

        - alert: TodoListBackendHighMemory
          expr: |
            (
              container_memory_working_set_bytes{
                namespace=~"todolist-staging|todolist-prod",
                pod=~"todolist-backend-deployment-.*",
                container="todolist-backend"
              }
              /
              kube_pod_container_resource_limits{
                namespace=~"todolist-staging|todolist-prod",
                pod=~"todolist-backend-deployment-.*",
                container="todolist-backend",
                resource="memory",
                unit="byte"
              }
            ) > 0.80
          for: 5m
          labels:
            severity: warning
            component: backend
          annotations:
            summary: "TodoList backend memory usage is high"
            description: "Backend memory usage is above 80% of its memory limit in namespace {{ $labels.namespace }}."