apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: todolist-backend-alerts
  namespace: monitoring
  labels:
    release: monitoring

spec:
  groups:
    - name: todolist.backend
      rules:

        - alert: TodoListBackendDown
          expr: |
            (
              label_replace(
                kube_deployment_status_replicas_available{
                  namespace=~"todolist-(staging|prod)",
                  deployment="todolist-backend-deployment"
                },
                "target_namespace",
                "$1",
                "namespace",
                "(todolist-(staging|prod))"
              ) == 0
            )
            and on (target_namespace)
            (
              label_replace(
                kube_namespace_status_phase{
                  namespace=~"todolist-(staging|prod)",
                  phase="Active"
                },
                "target_namespace",
                "$1",
                "namespace",
                "(todolist-(staging|prod))"
              ) == 1
            )
          for: 2m
          labels:
            severity: critical
            component: backend
          annotations:
            summary: "TodoList backend is down in {{ $labels.target_namespace }}"
            description: "TodoList backend deployment in {{ $labels.target_namespace }} has no available replicas for more than 2 minutes."

        - alert: TodoListBackendHighCPU
          expr: |
            label_replace(
              (
                sum by (namespace, pod) (
                  rate(
                    container_cpu_usage_seconds_total{
                      namespace=~"todolist-(staging|prod)",
                      pod=~"todolist-backend-deployment-.*",
                      container="todolist-backend"
                    }[5m]
                  )
                )
                /
                sum by (namespace, pod) (
                  kube_pod_container_resource_requests{
                    namespace=~"todolist-(staging|prod)",
                    pod=~"todolist-backend-deployment-.*",
                    container="todolist-backend",
                    resource="cpu",
                    unit="core"
                  }
                )
              ),
              "target_namespace",
              "$1",
              "namespace",
              "(todolist-(staging|prod))"
            ) > 0.80
          for: 10m
          labels:
            severity: warning
            component: backend
          annotations:
            summary: "TodoList backend CPU is high in {{ $labels.target_namespace }}"
            description: "TodoList backend pod {{ $labels.pod }} in {{ $labels.target_namespace }} is using more than 80% of its requested CPU for more than 10 minutes."

        - alert: TodoListBackendHighMemory
          expr: |
            label_replace(
              (
                sum by (namespace, pod) (
                  container_memory_working_set_bytes{
                    namespace=~"todolist-(staging|prod)",
                    pod=~"todolist-backend-deployment-.*",
                    container="todolist-backend"
                  }
                )
                /
                sum by (namespace, pod) (
                  kube_pod_container_resource_requests{
                    namespace=~"todolist-(staging|prod)",
                    pod=~"todolist-backend-deployment-.*",
                    container="todolist-backend",
                    resource="memory",
                    unit="byte"
                  }
                )
              ),
              "target_namespace",
              "$1",
              "namespace",
              "(todolist-(staging|prod))"
            ) > 0.80
          for: 10m
          labels:
            severity: warning
            component: backend
          annotations:
            summary: "TodoList backend memory is high in {{ $labels.target_namespace }}"
            description: "TodoList backend pod {{ $labels.pod }} in {{ $labels.target_namespace }} is using more than 80% of its requested memory for more than 10 minutes."

        - alert: TodoListBackendPodRestarting
          expr: |
            label_replace(
              sum by (namespace, pod) (
                increase(
                  kube_pod_container_status_restarts_total{
                    namespace=~"todolist-(staging|prod)",
                    pod=~"todolist-backend-deployment-.*",
                    container="todolist-backend"
                  }[10m]
                )
              ),
              "target_namespace",
              "$1",
              "namespace",
              "(todolist-(staging|prod))"
            ) > 3
          for: 3m
          labels:
            severity: warning
            component: backend
          annotations:
            summary: "TodoList backend pod is restarting in {{ $labels.target_namespace }}"
            description: "TodoList backend pod {{ $labels.pod }} in {{ $labels.target_namespace }} has restarted more than 3 times in the last 10 minutes."