apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: todolist-frontend-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: todolist.frontend
      rules:

        - alert: TodoListFrontendDown
          expr: |
            kube_deployment_status_replicas_available{
              namespace=~"todolist-staging|todolist-prod",
              deployment="todolist-frontend-deployment"
            } < 1
          for: 5m
          labels:
            severity: critical
            component: frontend
          annotations:
            summary: "TodoList frontend is down"
            description: "The TodoList frontend has no available replicas in namespace {{ $labels.namespace }}."

        - alert: TodoListFrontendRestarts
          expr: |
            increase(
              kube_pod_container_status_restarts_total{
                namespace=~"todolist-staging|todolist-prod",
                pod=~"todolist-frontend-deployment-.*",
                container!="POD",
                container!=""
              }[10m]
            ) > 0
          for: 5m
          labels:
            severity: warning
            component: frontend
          annotations:
            summary: "TodoList frontend restarted"
            description: "The TodoList frontend container restarted during the last 10 minutes in namespace {{ $labels.namespace }}."