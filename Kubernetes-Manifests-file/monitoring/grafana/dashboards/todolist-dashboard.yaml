                  "__name__": true,
                  "namespace": true,
                  "container": true,
                  "instance": true,
                  "job": true
                },
                "renameByName": {
                  "pod": "Pod",
                  "Value #A": "CPU Usage",
                  "Value #B": "CPU % Limit",
                  "Value #C": "Memory Usage",
                  "Value #D": "Memory % Limit"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                }
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "CPU Usage"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "cores"
                  },
                  {
                    "id": "decimals",
