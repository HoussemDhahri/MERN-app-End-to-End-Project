apiVersion: v1
kind: ConfigMap

metadata:
  name: todolist-monitoring-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"

data:
  todolist-monitoring-dashboard.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": false,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "🌐 Application Overview",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Frontend Status",
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "min(probe_success{job=\"todolist-frontend-blackbox\",instance=\"http://todolist-frontend-service.$namespace.svc:3000/\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 1,
              "unit": "short",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    },
                    "1": {
                      "text": "UP",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "justifyMode": "center",
            "graphMode": "none"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Backend Status",
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 8,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "min(kube_deployment_status_replicas_available{namespace=\"$namespace\",deployment=\"todolist-backend-deployment\"}) / clamp_min(min(kube_deployment_spec_replicas{namespace=\"$namespace\",deployment=\"todolist-backend-deployment\"}),1)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 1,
              "unit": "percentunit",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    },
                    "1": {
                      "text": "UP",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "justifyMode": "center",
            "graphMode": "none"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "MongoDB Status",
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 16,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "min(kube_statefulset_status_replicas_ready{namespace=\"$namespace\",statefulset=\"todolist-database-statefulset\"}) / clamp_min(min(kube_statefulset_replicas{namespace=\"$namespace\",statefulset=\"todolist-database-statefulset\"}),1)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 1,
              "unit": "percentunit",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    },
                    "1": {
                      "text": "UP",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "justifyMode": "center",
            "graphMode": "none"
          }
        },
        {
          "id": 5,
          "type": "table",
          "title": "Container Restarts (Total)",
          "description": "Cumulative restart count per container since last pod start.",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "format": "table",
              "instant": true,
              "expr": "sort_desc(sum by (pod, container) (kube_pod_container_status_restarts_total{namespace=\"$namespace\",container!=\"\",container!=\"POD\"}))"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {
                  "pod": 0,
                  "container": 1,
                  "Value": 2
                },
                "renameByName": {
                  "pod": "Pod",
                  "container": "Container",
                  "Value": "Restarts"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                }
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Restarts"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "yellow",
                          "value": 1
                        },
                        {
                          "color": "red",
                          "value": 3
                        }
                      ]
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            },
            "columnWidth": {
              "Pod": 55,
              "Container": 32,
              "Restarts": 16
            }
          }
        },
        {
          "id": 7,
          "type": "table",
          "title": "Containers With Problems (Waiting Reason)",
          "description": "Containers currently stuck in a non-running waiting state.",
          "gridPos": {
            "h": 6,
            "w": 24,
            "x": 0,
            "y": 14
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "format": "table",
              "instant": true,
              "expr": "kube_pod_container_status_waiting_reason{namespace=\"$namespace\"} == 1"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "job": true,
                  "instance": true,
                  "endpoint": true,
                  "service": true,
                  "uid": true,
                  "namespace": true,
                  "Value": true
                },
                "indexByName": {
                  "pod": 0,
                  "container": 1,
                  "reason": 2
                },
                "renameByName": {
                  "pod": "Pod",
                  "container": "Container",
                  "reason": "Reason"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                }
              }
            }
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            },
            "columnWidth": {
              "Pod": 55,
              "Container": 32,
              "Reason": 32
            }
          }
        },
        {
          "id": 10,
          "type": "row",
          "title": "⚙️ Backend",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 20
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Backend CPU Usage vs Limit",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 21
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "Usage",
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"$namespace\",container=\"todolist-backend\",image!=\"\"}[5m]))"
            },
            {
              "refId": "B",
              "legendFormat": "Limit",
              "expr": "sum(kube_pod_container_resource_limits{namespace=\"$namespace\",container=\"todolist-backend\",resource=\"cpu\",unit=\"core\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cores",
              "min": 0,
              "decimals": 3,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "auto",
                "axisPlacement": "left"
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Backend Memory Usage vs Limit",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 21
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "Usage",
              "expr": "sum(container_memory_working_set_bytes{namespace=\"$namespace\",container=\"todolist-backend\",image!=\"\"})"
            },
            {
              "refId": "B",
              "legendFormat": "Limit",
              "expr": "sum(kube_pod_container_resource_limits{namespace=\"$namespace\",container=\"todolist-backend\",resource=\"memory\",unit=\"byte\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "decimals": 2,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "auto",
                "axisPlacement": "left"
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 13,
          "type": "table",
          "title": "Backend Pod Resource Usage",
          "description": "Current CPU and memory usage for each backend pod compared with limits.",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 29
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "format": "table",
              "instant": true,
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"$namespace\",container=\"todolist-backend\",image!=\"\"}[5m]))"
            },
            {
              "refId": "B",
              "format": "table",
              "instant": true,
              "expr": "100 * sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"$namespace\",container=\"todolist-backend\",image!=\"\"}[5m])) / clamp_min(sum by (pod) (kube_pod_container_resource_limits{namespace=\"$namespace\",container=\"todolist-backend\",resource=\"cpu\",unit=\"core\"}),0.001)"
            },
            {
              "refId": "C",
              "format": "table",
              "instant": true,
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"$namespace\",container=\"todolist-backend\",image!=\"\"})"
            },
            {
              "refId": "D",
              "format": "table",
              "instant": true,
              "expr": "100 * sum by (pod) (container_memory_working_set_bytes{namespace=\"$namespace\",container=\"todolist-backend\",image!=\"\"}) / clamp_min(sum by (pod) (kube_pod_container_resource_limits{namespace=\"$namespace\",container=\"todolist-backend\",resource=\"memory\",unit=\"byte\"}),1)"
            }
          ],
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "pod",
                "mode": "outer"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
