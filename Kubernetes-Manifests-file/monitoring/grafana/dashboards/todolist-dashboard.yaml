apiVersion: v1
kind: ConfigMap
metadata:
  name: todolist-monitoring-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  todolist-monitoring-dashboard.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": false,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "🌐 Application Overview",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Frontend Status",
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "min(probe_success{job=\"todolist-frontend-blackbox\",instance=\"http://todolist-frontend-service.$namespace.svc:3000/\"}) or vector(0)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 1,
              "unit": "short",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    },
                    "1": {
                      "text": "UP",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "textMode": "auto",
            "colorMode": "background",
            "justifyMode": "center",
            "graphMode": "none"
          },
          "description": "Synthetic blackbox probe result for the frontend service endpoint (1=reachable, 0=unreachable)."
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Backend Status",
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 8,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "min(kube_deployment_status_replicas_available{namespace=\"$namespace\",deployment=\"todolist-backend-deployment\"} >= bool clamp_min(kube_deployment_spec_replicas{namespace=\"$namespace\",deployment=\"todolist-backend-deployment\"},1)) or vector(0)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 1,
              "unit": "short",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    },
                    "1": {
                      "text": "UP",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "textMode": "auto",
            "colorMode": "background",
            "justifyMode": "center",
            "graphMode": "none"
          },
          "description": "Whether the backend deployment has as many ready replicas as it is configured to run."
        },
        {
          "id": 4,
          "type": "stat",
          "title": "MongoDB Status",
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 16,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "min(kube_statefulset_status_replicas_ready{namespace=\"$namespace\",statefulset=\"todolist-database-statefulset\"} >= bool clamp_min(kube_statefulset_replicas{namespace=\"$namespace\",statefulset=\"todolist-database-statefulset\"},1)) or vector(0)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 1,
              "unit": "short",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    },
                    "1": {
                      "text": "UP",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "textMode": "auto",
            "colorMode": "background",
            "justifyMode": "center",
            "graphMode": "none"
          },
          "description": "Whether the MongoDB statefulset has as many ready replicas as it is configured to run."
        },
        {
          "id": 5,
          "type": "table",
          "title": "Container Restarts (Total)",
          "description": "Cumulative restart count per container since last pod start.",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "format": "table",
              "instant": true,
              "expr": "sort_desc(sum by (pod, container) (kube_pod_container_status_restarts_total{namespace=\"$namespace\",container!=\"\",container!=\"POD\"}))"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {
                  "pod": 0,
                  "container": 1,
                  "Value": 2
                },
                "renameByName": {
                  "pod": "Pod",
                  "container": "Container",
                  "Value": "Restarts"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                }
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Restarts"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "yellow",
                          "value": 1
                        },
                        {
                          "color": "red",
                          "value": 3
                        }
                      ]
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            },
            "columnWidth": {
              "Pod": 55,
              "Container": 32,
              "Restarts": 16
            }
          }
        },
        {
          "id": 6,
          "type": "table",
          "title": "Containers With Problems (Waiting Reason)",
          "description": "Containers currently stuck in a non-running waiting state.",
          "gridPos": {
            "h": 6,
            "w": 24,
            "x": 0,
            "y": 14
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "format": "table",
              "instant": true,
              "expr": "kube_pod_container_status_waiting_reason{namespace=\"$namespace\"} == 1"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "job": true,
                  "instance": true,
                  "endpoint": true,
                  "service": true,
                  "uid": true,
                  "namespace": true,
                  "Value": true
                },
                "indexByName": {
                  "pod": 0,
                  "container": 1,
                  "reason": 2
                },
                "renameByName": {
                  "pod": "Pod",
                  "container": "Container",
                  "reason": "Reason"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                }
              }
            }
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            },
            "columnWidth": {
              "Pod": 55,
              "Container": 32,
              "Reason": 32
            }
          }
        },
        {
          "id": 7,
          "type": "row",
          "title": "📊 Application Performance",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 20
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Requests/sec",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 21
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "Requests/sec",
              "expr": "sum(rate(http_requests_total{namespace=\"$namespace\",job=\"todolist-backend-service\",route!~\"/metrics|/ready|/healthz\"}[5m]))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "min": 0,
              "decimals": 2,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "auto",
                "axisPlacement": "left"
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "description": "Total backend HTTP request throughput, excluding metrics/health/readiness endpoints."
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "HTTP Error Rate (4xx + 5xx)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 21
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "4xx + 5xx",
              "expr": "100 * sum(rate(http_requests_total{namespace=\"$namespace\",job=\"todolist-backend-service\",route!~\"/metrics|/ready|/healthz\",status=~\"4..|5..\"}[5m])) / clamp_min(sum(rate(http_requests_total{namespace=\"$namespace\",job=\"todolist-backend-service\",route!~\"/metrics|/ready|/healthz\"}[5m])),0.001)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "decimals": 2,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "auto",
                "axisPlacement": "left"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "description": "Percentage of backend HTTP requests returning a 4xx or 5xx status, excluding metrics/health/readiness endpoints."
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Errors by Status",
          "description": "HTTP errors separated into 4xx and 5xx responses.",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 29
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "4xx",
              "expr": "sum(increase(http_requests_total{namespace=\"$namespace\",job=\"todolist-backend-service\",route!~\"/metrics|/ready|/healthz\",status=~\"4..\"}[5m]))"
            },
            {
              "refId": "B",
              "legendFormat": "5xx",
              "expr": "sum(increase(http_requests_total{namespace=\"$namespace\",job=\"todolist-backend-service\",route!~\"/metrics|/ready|/healthz\",status=~\"5..\"}[5m]))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "decimals": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "auto",
                "axisPlacement": "left"
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 11,
          "type": "row",
          "title": "🖥️ Frontend",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 37
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Frontend CPU Usage vs Limit (Per Pod)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 38
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "Usage - {{pod}}",
              "expr": "1000 * sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"$namespace\",container=\"todolist-frontend\",image!=\"\"}[5m]))"
            },
            {
              "refId": "B",
              "legendFormat": "Limit - Frontend",
              "expr": "1000 * max(kube_pod_container_resource_limits{namespace=\"$namespace\",container=\"todolist-frontend\",resource=\"cpu\",unit=\"core\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "suffix:m",
              "min": 0,
              "decimals": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "auto",
                "axisPlacement": "left"
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "description": "Frontend container CPU usage per pod compared against its configured CPU limit."
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Frontend Memory Usage vs Limit (Per Pod)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 38
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "Usage - {{pod}}",
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"$namespace\",container=\"todolist-frontend\",image!=\"\"})"
            },
            {
              "refId": "B",
              "legendFormat": "Limit - Frontend",
              "expr": "max(kube_pod_container_resource_limits{namespace=\"$namespace\",container=\"todolist-frontend\",resource=\"memory\",unit=\"byte\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "decimals": 2,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "auto",
                "axisPlacement": "left"
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "description": "Frontend container memory usage per pod compared against its configured memory limit."
        },
        {
          "id": 14,
          "type": "row",
          "title": "⚙️ Backend",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 46
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "Backend CPU Usage vs Limit (Per Pod)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 47
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "Usage - {{pod}}",
              "expr": "1000 * sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"$namespace\",container=\"todolist-backend\",image!=\"\"}[5m]))"
            },
            {
              "refId": "B",
              "legendFormat": "Limit - Backend",
              "expr": "1000 * max(kube_pod_container_resource_limits{namespace=\"$namespace\",container=\"todolist-backend\",resource=\"cpu\",unit=\"core\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "suffix:m",
              "min": 0,
              "decimals": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "auto",
                "axisPlacement": "left"
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "description": "Backend container CPU usage per pod compared against its configured CPU limit."
        },
        {
          "id": 16,
          "type": "timeseries",
          "title": "Backend Memory Usage vs Limit (Per Pod)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 47
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "Usage - {{pod}}",
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"$namespace\",container=\"todolist-backend\",image!=\"\"})"
            },
            {
              "refId": "B",
              "legendFormat": "Limit - Backend",
              "expr": "max(kube_pod_container_resource_limits{namespace=\"$namespace\",container=\"todolist-backend\",resource=\"memory\",unit=\"byte\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "decimals": 2,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "auto",
                "axisPlacement": "left"
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "description": "Backend container memory usage per pod compared against its configured memory limit."
        },
        {
          "id": 17,
          "type": "timeseries",
          "title": "Backend CPU Throttling (%)",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 55
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{pod}}",
              "expr": "100 * sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace=\"$namespace\",container=\"todolist-backend\",image!=\"\"}[5m])) / clamp_min(sum by (pod) (rate(container_cpu_cfs_periods_total{namespace=\"$namespace\",container=\"todolist-backend\",image!=\"\"}[5m])),0.001)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 5
                  },
                  {
                    "color": "red",
                    "value": 15
                  }
                ]
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            }
          },
          "description": "Percentage of CPU periods in which the backend container was throttled by the CFS scheduler."
        },
        {
          "id": 18,
          "type": "row",
          "title": "🗄️ Database",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 63
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 19,
          "type": "timeseries",
          "title": "MongoDB CPU Usage vs Limit (Per Pod)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 64
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "Usage - {{pod}}",
              "expr": "1000 * sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"$namespace\",container=\"mongodb\",image!=\"\"}[5m]))"
            },
            {
              "refId": "B",
              "legendFormat": "Limit - MongoDB",
              "expr": "1000 * max(kube_pod_container_resource_limits{namespace=\"$namespace\",container=\"mongodb\",resource=\"cpu\",unit=\"core\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "suffix:m",
              "min": 0,
              "decimals": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "auto",
                "axisPlacement": "left"
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "description": "MongoDB container CPU usage per pod compared against its configured CPU limit."
        },
        {
          "id": 20,
