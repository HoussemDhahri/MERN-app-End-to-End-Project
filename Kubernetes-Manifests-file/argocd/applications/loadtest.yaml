apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: todolist-loadtest
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/HoussemDhahri/MERN-app-End-to-End-Project.git
    targetRevision: HEAD
    path: Kubernetes-Manifests-file/overlays/prod/loadgenerator

  destination:
    server: https://kubernetes.default.svc
    namespace: todolist-prod

  syncPolicy: {}